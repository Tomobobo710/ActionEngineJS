[workspace]
members = [".", "examples/*"]
resolver = "2"

[package]
name = "action-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", optional = true }
fontdue = "0.9.3"
glow = { version = "0.16.0", optional = true }
image-webp = { version = "0.2.4", optional = true }
jpeg-decoder = { version = "0.3.2", optional = true }
lewton = "0.10.2"
png = { version = "0.18.0", optional = true }
puremp3 = "0.1.0"
winit = { version = "0.30.12", optional = true }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = { version = "0.11.1", optional = true }
glutin = { version = "0.32.3", optional = true }
glutin-winit = { version = "0.5.0", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }

# Linux audio (PulseAudio - works with PipeWire via pipewire-pulse)
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

# Windows/macOS audio (cpal)
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.17.1"

# Web-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
    "Performance",
    # WebAudio features
    "AudioContext",
    "AudioDestinationNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "GainNode",
    "AudioNode",
    "AudioParam",
] }

[features]
default = []
# Enable the glow/OpenGL backend with windowing support (works on native and web)
glow-backend = ["dep:winit", "dep:glow", "dep:bytemuck", "native-backend", "web-backend"]
# Native-specific features (auto-enabled on native when glow-backend is used)
native-backend = ["dep:glutin", "dep:glutin-winit", "dep:raw-window-handle", "dep:gilrs"]
# Web-specific features (auto-enabled on web when glow-backend is used)
web-backend = ["dep:wasm-bindgen", "dep:web-sys", "dep:console_error_panic_hook"]
png = ["dep:png"]
jpeg-decoder = ["dep:jpeg-decoder"]
image-webp = ["dep:image-webp"]

# Optimize audio decoders even in debug builds (pure Rust decoders are too slow otherwise)
[profile.dev.package.puremp3]
opt-level = 3

[profile.dev.package.lewton]
opt-level = 3

[profile.dev.package.ogg]
opt-level = 3
