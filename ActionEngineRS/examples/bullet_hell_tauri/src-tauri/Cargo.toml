[package]
name = "bullet_hell_tauri_app"
version = "0.1.0"
description = "Bullet Hell game packaged with Tauri"
edition = "2021"

[workspace]

[lib]
name = "bullet_hell_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
